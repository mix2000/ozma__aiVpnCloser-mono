name: check

# Только проверки. Сборки и релизы — локально: scripts/release.sh.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # dist нужен tauri::generate_context! при сборке crates/app.
      - name: UI — format, lint, typecheck, test:coverage, build
        working-directory: ui
        run: |
          npm ci
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test:coverage
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Rust — fmt, clippy, test (вместе со сторожами tests/guards.rs)
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace

      - name: Сторожа (guards.sh)
        shell: bash
        run: bash scripts/guards.sh

  e2e:
    # Playwright на моке бэкенда — одной ОС достаточно.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: e2e
        working-directory: ui
        run: |
          npm ci
          npx playwright install chromium
          npm run test:e2e
