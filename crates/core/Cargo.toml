[package]
name = "vpn-closer-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "vpn_closer_core"

[features]
# Внутренности ядра для интеграционных тестов и примеров (модуль `testing`).
test-util = []

[[example]]
name = "inspect"
required-features = ["test-util"]

[dependencies]
chrono.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
# Сам себя с test-util — интеграционным тестам нужны внутренности.
vpn-closer-core = { path = ".", features = ["test-util"] }
