[workspace]
resolver = "2"
# crates/core — логика без GUI, crates/app — Tauri 2.
members = ["crates/*"]

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
dirs = "6"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tempfile = "3"
thiserror = "2"
windows-sys = "0.61"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
